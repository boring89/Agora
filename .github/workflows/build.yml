# Builds every port against a STELA release, tests each in QEMU, signs the
# index and uploads the packages, the index and copies of every upstream
# source as a DRAFT GitHub release of this repository (docs/release.md).
# Started from STELA P14's version (K18); never run yet.
#
# Before the first run:
# - Make the package key (docs/signing.md): `portbuild.py keygen
#   agora-packages`, commit keys/agora-packages.pub, give STELA's
#   tools/pkg.pub the same public key, and put the .key file's one line
#   into the secret PKG_SIGNING_KEY of the `release` environment. Never
#   the System key: STELA signs System images on the releaser's machine.
# - STELA_REPO (a repository variable) if STELA is not boring89/STELA.
name: Build ports

on:
  workflow_dispatch:
    inputs:
      stela_ref:
        description: "STELA tag (or commit) to build against; default: STELA_VERSION"
        required: false
      release_tag:
        description: "Tag of this repository's draft release; default: the pushed tag, else stela_ref"
        required: false
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    # The environment holds PKG_SIGNING_KEY (and may require a reviewer).
    environment: release
    steps:
      - name: Check out Agora
        uses: actions/checkout@v4
        with:
          path: agora
      - name: Which STELA, which release
        id: which
        run: |
          ref='${{ inputs.stela_ref }}'
          [ -n "$ref" ] || ref="$(cat agora/STELA_VERSION)"
          tag='${{ inputs.release_tag }}'
          if [ -z "$tag" ]; then
            if [ "$GITHUB_REF_TYPE" = tag ]; then tag="$GITHUB_REF_NAME"; else tag="$ref"; fi
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Building against STELA $ref for release $tag"
      - name: Check out STELA
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.STELA_REPO || 'boring89/STELA' }}
          ref: ${{ steps.which.outputs.ref }}
          path: STELA
      - name: Install packages
        # As STELA's CI, plus python3-cryptography for the signature.
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf python3 python3-cryptography mtools gdisk gcc binutils-m68k-linux-gnu xz-utils bzip2 unzip
      - name: Lint
        run: python3 agora/tools/portbuild.py lint
      - name: Upstream sources
        # Fetched once per set of recipes; portbuild checks each SHA-256.
        uses: actions/cache@v4
        with:
          path: agora/sources
          key: sources-${{ hashFiles('agora/ports/*/port.toml') }}
      - name: Fetch sources
        run: python3 agora/tools/portbuild.py fetch all
        env:
          STELA_ROOT: ${{ github.workspace }}/STELA
      - name: musl and libchewing tarballs
        # STELA's Makefile checks their SHA-256 (STELA's ci.yml has the sums).
        run: |
          mkdir -p cache
          curl -fsSL -o cache/musl-1.2.5.tar.gz https://musl.libc.org/releases/musl-1.2.5.tar.gz
          echo "a9a118bbe84d8764da0ea0d28b3ab3fae8477fc7e4085d90102b8596fc7c75e4  cache/musl-1.2.5.tar.gz" | sha256sum -c -
          curl -fsSL -o cache/libchewing-0.5.1.tar.bz2 https://github.com/chewing/libchewing/releases/download/v0.5.1/libchewing-0.5.1.tar.bz2
          echo "9708c63415fa6034435c0f38100e7d30d0e1bac927f67bec6dfeb3fef016172b  cache/libchewing-0.5.1.tar.bz2" | sha256sum -c -
          echo "MUSL_TARBALL=$PWD/cache/musl-1.2.5.tar.gz" >> "$GITHUB_ENV"
          echo "CHEWING_TARBALL=$PWD/cache/libchewing-0.5.1.tar.bz2" >> "$GITHUB_ENV"
      - name: Build STELA (what the tests boot)
        working-directory: STELA
        run: cargo --version && make musl esp test-images ehfs-tools
      - name: Build, package and test every port
        run: python3 agora/tools/portbuild.py all all
        env:
          STELA_ROOT: ${{ github.workspace }}/STELA
      - name: Signed index
        # The urls are absolute until STELA's pkg joins relative ones
        # (docs/index.md): this release's download folder.
        run: |
          umask 077
          printf '%s\n' "$PKG_SIGNING_KEY" > "$RUNNER_TEMP/pkg-signing.key"
          PKG_SIGNING_KEY="$RUNNER_TEMP/pkg-signing.key" python3 agora/tools/portbuild.py index
          rm -f "$RUNNER_TEMP/pkg-signing.key"
          for pub in agora/keys/*.pub; do
            [ -e "$pub" ] && python3 agora/tools/portbuild.py verify "$pub" agora/dist/index.json
          done
        env:
          STELA_ROOT: ${{ github.workspace }}/STELA
          PKG_SIGNING_KEY: ${{ secrets.PKG_SIGNING_KEY }}
          PORTS_URL: https://github.com/${{ github.repository }}/releases/download/${{ steps.which.outputs.tag }}/
      - name: Upstream sources for the release
        run: python3 agora/tools/portbuild.py sources agora/dist/sources
      - name: Release (draft)
        # The releaser looks at the draft and publishes it by hand.
        working-directory: agora/dist
        run: |
          sha256sum *.tar index.json index.json.sig sources/* | sed 's# sources/# #' > SHA256SUMS
          gh release create "$TAG" --draft --repo "$GITHUB_REPOSITORY" \
            --title "Ports for STELA $REF" \
            --notes "Built against STELA $REF (Agora $GITHUB_SHA); every package tested in QEMU only. sources/ are the unchanged upstream tarballs (SOURCES.txt)." \
            *.tar index.json index.json.sig SHA256SUMS sources/*
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.which.outputs.tag }}
          REF: ${{ steps.which.outputs.ref }}
